<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solucionador IA: Matemáticas y Código Interactivo</title>
    
    <script src="[https://polyfill.io/v3/polyfill.min.js?features=es6](https://polyfill.io/v3/polyfill.min.js?features=es6)"></script>
    <script>
      MathJax = {
        tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] },
        startup: { typeset: false }
      };
    </script>
    <script id="MathJax-script" async src="[https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js](https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js)"></script>

    <style>
        :root {
            --primary-color: #0f172a;
            --accent-color: #8b5cf6;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #334155;
            --border-color: #cbd5e1;
            --success-color: #10b981;
        }

        [data-theme="dark"] {
            --primary-color: #f8fafc;
            --accent-color: #a78bfa;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #cbd5e1;
            --border-color: #475569;
            --success-color: #34d399;
        }

        * { transition: background-color 0.3s, color 0.3s, border-color 0.3s; }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
            line-height: 1.6;
        }

        .header-container {
            display: flex; flex-direction: column; align-items: center;
            margin-bottom: 30px; border-bottom: 3px solid var(--accent-color); padding-bottom: 20px;
        }

        h1 { color: var(--primary-color); text-align: center; margin: 0 0 15px 0;}

        #theme-toggle {
            background-color: var(--card-bg); color: var(--primary-color);
            border: 2px solid var(--accent-color); padding: 8px 16px;
            border-radius: 20px; cursor: pointer; font-weight: 600;
        }

        .upload-section {
            background-color: var(--card-bg); padding: 30px; border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 30px;
            border: 1px solid var(--border-color);
        }

        .controls-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .control-group { display: flex; flex-direction: column; gap: 8px; }
        .control-group label { font-weight: bold; color: var(--primary-color); font-size: 0.95rem; }

        select, textarea, input[type="text"] {
            padding: 10px 15px; border-radius: 8px; border: 2px solid var(--border-color);
            background-color: var(--bg-color); color: var(--text-main); font-size: 1rem; width: 100%; outline: none; box-sizing: border-box;
        }
        select:focus, textarea:focus, input[type="text"]:focus { border-color: var(--accent-color); }

        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn {
            flex: 1; padding: 10px; background: var(--bg-color); border: 2px solid var(--border-color);
            border-radius: 8px; cursor: pointer; font-weight: 600; color: var(--text-main);
        }
        .tab-btn.active { border-color: var(--accent-color); background-color: rgba(139, 92, 246, 0.1); }

        .input-panel { display: none; text-align: center; }
        .input-panel.active { display: block; }

        textarea { resize: vertical; min-height: 120px; font-family: monospace; text-align: left; }

        .file-upload-wrapper { position: relative; margin-bottom: 10px; }
        .file-upload-input { width: 0.1px; height: 0.1px; opacity: 0; position: absolute; z-index: -1; }
        
        .file-upload-label {
            display: inline-block; padding: 20px; background-color: transparent;
            color: var(--primary-color); border: 2px dashed var(--accent-color);
            border-radius: 8px; font-weight: 600; cursor: pointer; width: 100%; box-sizing: border-box;
        }
        .file-upload-label:hover { background-color: rgba(139, 92, 246, 0.1); }

        #image-preview { max-width: 100%; max-height: 200px; margin-top: 10px; border-radius: 8px; display: none; }

        .btn-primary {
            background-color: var(--accent-color); color: white; border: none;
            padding: 12px 24px; border-radius: 8px; font-size: 1.1rem; font-weight: bold;
            cursor: pointer; width: 100%; margin-top: 20px;
        }
        .btn-primary:disabled { background-color: var(--border-color); cursor: not-allowed; color: #64748b; }

        #loading { text-align: center; display: none; font-weight: bold; color: var(--accent-color); margin: 20px 0; font-size: 1.2rem; }

        #solution-container {
            display: none; background-color: var(--card-bg); padding: 30px; border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 1px solid var(--border-color); border-left: 5px solid var(--success-color);
            margin-bottom: 30px;
        }
        #math-output { overflow-x: auto; font-size: 1rem; }
        #math-output pre { background: var(--bg-color); padding: 15px; border-radius: 8px; border: 1px solid var(--border-color); }

        /* Estilos para la sección de seguimiento interactivo */
        .chat-followup {
            margin-top: 25px; border-top: 2px dashed var(--border-color); padding-top: 20px;
        }
        .chat-history {
            display: flex; flex-direction: column; gap: 15px; margin-bottom: 15px;
        }
        .chat-bubble {
            padding: 15px; border-radius: 8px; background-color: var(--bg-color); border: 1px solid var(--border-color);
        }
        .chat-input-wrapper {
            display: flex; gap: 10px;
        }
    </style>
</head>
<body>

    <div class="header-container">
        <h1>Solucionador IA: Interactivo</h1>
        <button id="theme-toggle">🌙 Modo Oscuro</button>
    </div>

    <div class="upload-section">
        <div class="controls-grid">
            <div class="control-group">
                <label for="categoria">Categoría:</label>
                <select id="categoria">
                    <option value="matematicas">📐 Matemáticas / Cálculo</option>
                    <option value="codigo">💻 Código de Programación</option>
                </select>
            </div>
            <div class="control-group">
                <label for="modo-resolucion">Tipo de respuesta:</label>
                <select id="modo-resolucion">
                    <option value="detallado">📚 Explicación detallada</option>
                    <option value="procedimiento_directo">⚙️ Solo procedimiento / Directo</option>
                    <option value="solo_respuesta">🎯 Solo respuesta final</option>
                </select>
            </div>
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('image')">📸 Subir Imagen</button>
            <button class="tab-btn" onclick="switchTab('text')">⌨️ Escribir Código / Texto</button>
        </div>

        <div id="panel-image" class="input-panel active">
            <div class="file-upload-wrapper">
                <input type="file" id="imageInput" class="file-upload-input" accept="image/*" onchange="previewImage(event)">
                <label for="imageInput" class="file-upload-label">Haz clic para subir imagen</label>
            </div>
            <img id="image-preview" alt="Previsualización">
        </div>

        <div id="panel-text" class="input-panel">
            <textarea id="codeInput" placeholder="Escribe tu código o problema aquí..."></textarea>
        </div>

        <button id="solve-btn" class="btn-primary" onclick="enviarConsulta()">Analizar y Resolver</button>
    </div>

    <div id="loading">La IA está procesando tu solicitud... ⚙️</div>

    <!-- Contenedor del Resultado e Interacción -->
    <div id="solution-container">
        <h2 style="color: var(--primary-color); margin-top: 0;">Resultado Generado</h2>
        <div id="math-output"></div>

        <!-- Caja de chat para interactuar y añadir cambios -->
        <div class="chat-followup">
            <h3 style="color: var(--primary-color); font-size: 1.1rem; margin-bottom: 10px;">💬 ¿Necesitas añadir algo o hacer una pregunta sobre este resultado?</h3>
            <div id="chat-conversation" class="chat-history"></div>
            <div class="chat-input-wrapper">
                <input type="text" id="chatInput" placeholder="Ej: Explícame el paso 2 de otra forma, o cambia esta variable a 'y'...">
                <button class="btn-primary" style="margin-top: 0; width: 150px;" onclick="enviarPreguntaChat()">Enviar</button>
            </div>
        </div>
    </div>

    <script>
        const themeToggleBtn = document.getElementById('theme-toggle');
        const rootElement = document.documentElement;
        if (localStorage.getItem('theme') === 'dark') {
            rootElement.setAttribute('data-theme', 'dark');
            themeToggleBtn.textContent = '☀️ Modo Claro';
        }

        themeToggleBtn.addEventListener('click', () => {
            if (rootElement.getAttribute('data-theme') === 'dark') {
                rootElement.removeAttribute('data-theme');
                localStorage.setItem('theme', 'light');
                themeToggleBtn.textContent = '🌙 Modo Oscuro';
            } else {
                rootElement.setAttribute('data-theme', 'dark');
                localStorage.setItem('theme', 'dark');
                themeToggleBtn.textContent = '☀️ Modo Claro';
            }
        });

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.input-panel').forEach(p => p.classList.remove('active'));
            
            if (tab === 'image') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('panel-image').classList.add('active');
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('panel-text').classList.add('active');
            }
        }

        function previewImage(event) {
            const input = event.target;
            const preview = document.getElementById('image-preview');
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    preview.src = e.target.result;
                    preview.style.display = 'inline-block';
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        async function enviarConsulta() {
            const categoria = document.getElementById('categoria').value;
            const modo = document.getElementById('modo-resolucion').value;
            const imageInput = document.getElementById('imageInput');
            const codeInput = document.getElementById('codeInput').value.trim();
            
            const isImageTab = document.getElementById('panel-image').classList.contains('active');

            if (isImageTab && (!imageInput.files || !imageInput.files[0])) {
                alert("Por favor selecciona una imagen primero.");
                return;
            }
            if (!isImageTab && !codeInput) {
                alert("Por favor escribe o pega contenido.");
                return;
            }

            document.getElementById('loading').style.display = 'block';
            document.getElementById('solution-container').style.display = 'none';
            document.getElementById('solve-btn').disabled = true;
            document.getElementById('chat-conversation').innerHTML = ''; // Limpiar chat previo

            const formData = new FormData();
            formData.append('categoria', categoria);
            formData.append('modo', modo);
            
            if (isImageTab && imageInput.files[0]) {
                formData.append('imagen', imageInput.files[0]);
            } else {
                formData.append('codigo_texto', codeInput);
            }

            try {
                const response = await fetch('/resolver', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();

                if (data.error) {
                    alert("Error: " + data.error);
                } else {
                    const outputDiv = document.getElementById('math-output');
                    outputDiv.innerHTML = data.solucion_html;
                    document.getElementById('solution-container').style.display = 'block';
                    
                    MathJax.typesetClear([outputDiv]);
                    MathJax.typesetPromise([outputDiv]).catch(err => console.error(err.message));
                }
            } catch (error) {
                alert("Error de conexión con el servidor.");
            } finally {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('solve-btn').disabled = false;
            }
        }

        async function enviarPreguntaChat() {
            const chatInput = document.getElementById('chatInput');
            const mensaje = chatInput.value.trim();
            if (!mensaje) return;

            const chatContainer = document.getElementById('chat-conversation');
            
            // Mostrar pregunta del usuario
            const userBubble = document.createElement('div');
            userBubble.className = 'chat-bubble';
            userBubble.innerHTML = `<strong>Tú:</strong> ${mensaje}`;
            chatContainer.appendChild(userBubble);
            
            chatInput.value = '';

            // Mostrar estado de carga temporal
            const loadingBubble = document.createElement('div');
            loadingBubble.className = 'chat-bubble';
            loadingBubble.id = 'temp-loading';
            loadingBubble.innerHTML = `<em>La IA está respondiendo...</em>`;
            chatContainer.appendChild(loadingBubble);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ mensaje: mensaje })
                });
                const data = await response.json();

                document.getElementById('temp-loading').remove();

                if (data.error) {
                    alert("Error: " + data.error);
                } else {
                    const aiBubble = document.createElement('div');
                    aiBubble.className = 'chat-bubble';
                    aiBubble.innerHTML = `<strong>IA:</strong><br>${data.respuesta_html}`;
                    chatContainer.appendChild(aiBubble);

                    // Renderizar MathJax para las nuevas respuestas del chat
                    MathJax.typesetClear([aiBubble]);
                    MathJax.typesetPromise([aiBubble]).catch(err => console.error(err.message));
                    chatContainer.scrollTop = chatContainer.scrollHeight;
                }
            } catch (error) {
                document.getElementById('temp-loading').remove();
                alert("Error de conexión en el chat.");
            }
        }
    </script>
</body>
</html>
